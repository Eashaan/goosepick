name: Fix group display numbers

on:
  push:
    branches: [codex/foundation-hardening-3]
    paths:
      - 'scripts/fix_group_display_numbers.py'
      - '.github/workflows/fix-group-display-numbers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/foundation-hardening-3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_group_display_numbers.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/public/GroupCourtPulse.tsx src/pages/admin/AdminGroup.tsx src/components/public/PersonalRoster.tsx
          git commit -m 'Use canonical physical court numbers in groups'
          git push origin HEAD:codex/foundation-hardening-3
