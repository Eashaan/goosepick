name: Apply hardening 3 follow-up

on:
  push:
    branches: [codex/foundation-hardening-3]
    paths:
      - 'scripts/apply_hardening_3_followup.py'
      - '.github/workflows/apply-hardening-3-followup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/foundation-hardening-3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_hardening_3_followup.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/public/PublicGroup.tsx supabase/functions/submit-feedback/index.ts
          git commit -m 'Finish group identity and multi-city hardening'
          git push origin HEAD:codex/foundation-hardening-3
