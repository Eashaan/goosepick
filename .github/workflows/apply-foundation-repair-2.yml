name: Apply Foundation Repair 2

on:
  push:
    branches: [codex/foundation-repair-2]
    paths:
      - scripts/foundation_repair_2_patch.py

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/foundation-repair-2
          fetch-depth: 0

      - name: Apply session-scoping patch
        run: python scripts/foundation_repair_2_patch.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Migrate app callers to session-scoped foundation"
          git push origin codex/foundation-repair-2
